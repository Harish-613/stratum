[project]
name = "stratum-engine"
version = "0.1.0"
description = "Tree-sitter analysis engine for Stratum: dependency graphs, cycles, dead code, duplicates"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
]

[project.scripts]
stratum = "stratum_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stratum_engine"]
